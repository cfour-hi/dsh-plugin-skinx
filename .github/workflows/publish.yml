name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify and pack without uploading to npm
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # OIDC token for npm Trusted Publishing and provenance

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Ensure npm supports Trusted Publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version
      - run: pnpm install --frozen-lockfile
      - name: Resolve version and dist-tag
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          dist_tag=latest
          case "$version" in
            *-*) dist_tag=next ;;
          esac
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
      - name: Verify
        run: pnpm run verify
      - name: Dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm publish --dry-run --access public
      - name: Publish with OIDC
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        run: npm publish --provenance --access public --tag ${{ steps.version.outputs.dist_tag }}
