name: OIDC debug

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Print npm OIDC claims
        run: |
          response=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org")
          token=$(node -p "JSON.parse(process.argv[1]).value" "$response")
          node -e 'const p=JSON.parse(Buffer.from(process.argv[1].split(".")[1],"base64url"));console.log(JSON.stringify({repository:p.repository,repository_owner:p.repository_owner,repository_owner_id:p.repository_owner_id,workflow:p.workflow,workflow_ref:p.workflow_ref,job_workflow_ref:p.job_workflow_ref,environment:p.environment,ref:p.ref,ref_type:p.ref_type,event_name:p.event_name},null,2))' "$token"
